<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerdas Anak Hebat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LATAR BELAKANG -->
  <div id="latar-pembuka">
   <img src="awan.png" class="awan awan-1" alt="Awan">
   <img src="awan.png" class="awan awan-2" alt="Awan">
    <div class="rumput"></div>
  </div>

  <!-- LAYAR 1: PEMBUKA -->
  <div class="layar aktif" id="layar-pembuka">
    <h1 class="nama-aplikasi">Cerdas Anak Hebat</h1>

    <div class="baris-karakter">
      <div class="karakter">🐱</div>
      <div class="karakter">🐰</div>
      <div class="karakter">🦁</div>
      <div class="karakter">🐻</div>
    </div>

    <div class="teks-memuat">Memuat...</div>

    <div class="kotak-bar">
      <div class="isi-bar" id="isiBar"></div>
    </div>

    <div class="persen" id="persen">0%</div>
  </div>

  <!-- LAYAR 2: PILIH BAHASA -->
  <div class="layar" id="layar-bahasa">
    <div class="kotak-pilih-bahasa">
      <h2>Pilih Bahasa</h2>
      <button class="tombol-bahasa" onclick="pilihBahasa('id')">🇮🇩 Indonesia</button>
      <button class="tombol-bahasa" onclick="pilihBahasa('en')">🇬🇧 English</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
