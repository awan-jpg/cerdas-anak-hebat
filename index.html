<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerdas Anak Hebat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LAYAR 1: PEMBUKA -->
  <div id="layar-pembuka" class="layar aktif">
    <div class="latar-pembuka"></div>
    <h1 class="nama-aplikasi">Cerdas Anak Hebat</h1>
    
    <div class="baris-karakter">
      <div class="karakter">🐱</div>
      <div class="karakter">🐰</div>
      <div class="karakter">🦁</div>
      <div class="karakter">🐻</div>
    </div>

    <p class="teks-memuat">Memuat...</p>
    <div class="kotak-bar">
      <div id="bar-memuat" class="isi-bar"></div>
    </div>
    <p id="angka-persen" class="persen">0%</p>
  </div>

  <!-- LAYAR 2: PILIH BAHASA -->
  <div id="layar-bahasa" class="layar">
    <div class="kotak-pilih-bahasa">
      <h2>Pilih Bahasa</h2>
      <button class="tombol-bahasa" onclick="pilihBahasa('id')">
        🇮🇩 Bahasa Indonesia
      </button>
      <button class="tombol-bahasa" onclick="pilihBahasa('en')">
        🇬🇧 English
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
